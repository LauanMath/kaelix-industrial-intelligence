services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kaelix
      POSTGRES_USER: kaelix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaelix -d kaelix"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      API_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://kaelix:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/kaelix?sslmode=disable
      API_ADMIN_EMAIL: ${API_ADMIN_EMAIL:?Set API_ADMIN_EMAIL}
      API_ADMIN_PASSWORD: ${API_ADMIN_PASSWORD:?Set API_ADMIN_PASSWORD}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
